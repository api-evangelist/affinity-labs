name: Affinity Labs
description: 'Affinity Labs was a consumer social-networking company founded in 2006 by Christopher
  Michel (founder of Military.com) that built online communities for niche professional groups
  including firefighters (FireLink), police officers (PoliceLink), nurses (NursingLink) and the
  Armed Forces (HMForces.co.uk). Backed by Trinity Ventures and the Mayfield Fund, it grew past
  one million registered members before being merged into Monster Worldwide (Monster.com) in a
  $61 million transaction in January 2008. Its European operations shut down in 2012 and its
  domains and content were amalgamated into the Monster brand. The company is defunct and
  publishes no developer/API surface; this profile is retained as a historical portfolio-lead
  record. Not to be confused with Affinity (affinity.co), the unrelated relationship-intelligence
  CRM.'
